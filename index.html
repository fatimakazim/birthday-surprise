<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8ede4"><title>For you ♡</title>
<style>
:root{--ink:#292626;--soft:#6e6468;--rose:#a63e56;--deep:#7c2638;--script:#b05a6e;--cream:#f8ede4;--paper:#fffaf4;--ease:cubic-bezier(.22,1,.36,1);--col:480px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
#ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.ambient-flower{position:absolute;opacity:.32;animation:drift 14s ease-in-out infinite}
@keyframes drift{50%{transform:translate(10px,-22px) rotate(90deg)}}
#stage{position:relative;z-index:1;min-height:100dvh}
.screen{width:100%;max-width:var(--col);min-height:100dvh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.enter{animation:screenIn .55s var(--ease) both}@keyframes screenIn{from{opacity:0;filter:blur(9px);transform:translateX(var(--dx,0px)) scale(.985)}to{opacity:1;filter:blur(0);transform:none}}
.leave{animation:screenOut .34s cubic-bezier(.4,0,1,1) both;pointer-events:none}@keyframes screenOut{to{opacity:0;filter:blur(8px);transform:translateX(calc(var(--dx,0px)*-1)) scale(.985)}}
.screen:focus{outline:none}
.rise{animation:rise .7s var(--ease) both;animation-delay:var(--d,0s)}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:#ffffff8c;box-shadow:0 2px 10px #8a55621a;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8a4659}
.display{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.01em}.h-xl{font-size:clamp(31px,8.6vw,40px);margin-top:18px}.h-lg{font-size:clamp(26px,7.2vw,34px);margin-top:18px}
.script{font-family:"Segoe Print","Bradley Hand",cursive;color:var(--script)}.script-lg{font-size:clamp(25px,6.6vw,31px);transform:rotate(-2deg);display:inline-flex;align-items:center;gap:6px;margin-top:8px}
.body{font-size:15.5px;line-height:1.7;font-weight:500}.sub{font-size:13.5px;color:var(--soft);margin-top:8px}.hint{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9a6674;font-weight:600}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(#b9546a,#8f2f46);color:white;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 4px 0 var(--deep),0 12px 22px #7c263847;transition:.18s}.btn:active{transform:translateY(3px)}
.heart-outline{width:24px;height:24px;vertical-align:middle}
.flower{overflow:visible;filter:drop-shadow(0 2px 3px #8a556222)}.corner{position:absolute;z-index:3;pointer-events:none;animation:spin 40s linear infinite}.tl{top:-12px;left:-10px}.tr{top:-10px;right:-8px}.br{bottom:-12px;right:-8px}@keyframes spin{to{transform:rotate(360deg)}}
.avatar{position:relative;width:var(--s);height:var(--s);border-radius:50%;background:white;display:grid;place-items:center;flex:none;box-shadow:0 0 0 5px #e9bfc799,0 0 0 10px #e1e7dab3,0 10px 24px #8a556240;cursor:pointer}.avatar svg{max-width:90%;max-height:90%}
.avatar-heart{position:absolute;top:20%;left:42%;font-size:17px;pointer-events:none;animation:heartFloat 1.3s ease-out forwards}@keyframes heartFloat{to{opacity:0;transform:translate(var(--x),-75px) scale(1.3)}}
.envelope__cat{margin-top:26px;min-height:76px;display:grid;place-items:end center}.dance{transform-origin:50% 92%;animation:dance 1.1s infinite;overflow:visible}@keyframes dance{0%,100%{transform:rotate(-5deg)}25%,75%{transform:translateY(-4px)}50%{transform:rotate(5deg)}}
.env-stage{position:relative;margin-top:auto;padding-top:28px;width:100%;display:grid;place-items:center}.env{position:relative;z-index:1;width:min(80vw,330px);aspect-ratio:3/2;transform:rotate(-3deg);perspective:900px;animation:floaty 4.5s ease-in-out infinite}@keyframes floaty{50%{translate:0 -6px}}
.env-body{position:absolute;inset:0;border-radius:7px;border:2px solid #9c6650;background:linear-gradient(170deg,#fbf1e6,#f3e2cf);box-shadow:0 10px 24px #8a555230}
.env-flap{position:absolute;top:0;left:0;width:100%;height:56%;transform-origin:top center;transform-style:preserve-3d;transition:transform .9s var(--ease) .25s;z-index:2}.env.open .env-flap{transform:rotateX(180deg)}
.env-flap svg{width:100%;height:100%;position:absolute;inset:0;backface-visibility:hidden}.env-flap .back{transform:rotateX(180deg)}.env-flap polygon{stroke:#9c6650;stroke-width:2.2;stroke-linejoin:round}.env-flap .front polygon{fill:#efdcc6}.env-flap .back polygon{fill:#fdf5ec}
.seal{position:absolute;left:50%;top:56%;z-index:4;width:50px;height:50px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#bf5870,#98304a 55%,#7c2638);box-shadow:0 3px 0 #5a1a2b,0 8px 14px #5a1a2b59,inset 0 0 0 3px #ffffff14;animation:wobble 3.2s infinite;display:grid;place-items:center;color:white;font-size:23px}.seal:after{content:"";position:absolute;inset:5px;border:1.5px solid #ffffff66;border-radius:50%}@keyframes wobble{50%{rotate:6deg}}.seal:before{content:"";position:absolute;inset:-4px;border:2px solid #a63e568c;border-radius:50%;animation:pulse 2.2s infinite}@keyframes pulse{to{transform:scale(1.7);opacity:0}}
.env.open{animation:none;translate:0 26px}.env.open .seal{animation:sealout .55s forwards;pointer-events:none}@keyframes sealout{to{transform:translate(-50%,-50%) scale(0);opacity:0}}
.envelope .hint{margin-top:34px;animation:hint 2.4s infinite}@keyframes hint{50%{translate:0 -3px}}
.sheet{position:relative;width:100%;padding:62px 20px 22px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#f9fcf6f5,#f4f8f2eb);border-radius:32px;box-shadow:0 24px 50px #8a556229,inset 0 0 0 1px #ffffffcc}.card-screen{justify-content:flex-start;padding-top:max(88px,calc(env(safe-area-inset-top) + 76px));gap:22px}.sheet-avatar{position:absolute;top:-46px;left:50%;transform:translateX(-50%)}.sheet .h-xl{margin-top:12px}.divider{display:flex;align-items:center;gap:12px;width:100%;margin:18px 0 16px;color:var(--rose)}.divider i{flex:1;border-top:1.5px dashed #7a566059}.sheet__msg{max-width:38ch}
.player{width:100%;display:grid;grid-template-columns:58px 1fr 40px;grid-template-areas:"cover title btn" "cover sub btn" "cover bar bar" "cover times times";column-gap:13px;align-items:center;text-align:left;padding:13px 14px;border-radius:20px;background:#ffffffb8;box-shadow:0 8px 22px #8a556224;margin-top:20px}.cover{grid-area:cover;width:58px;height:58px;border-radius:12px;background:conic-gradient(#f0d3d9 25%,#fbf1e6 0 50%,#f0d3d9 0 75%,#fbf1e6 0) 0 0/14.5px 14.5px;box-shadow:inset 0 0 0 1.5px #e9bfc7;display:grid;place-items:center;font-size:28px}.player-title{grid-area:title;font-family:Georgia,serif;font-weight:bold;font-size:15px}.player-sub{grid-area:sub;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);font-weight:bold}.play{grid-area:btn;width:40px;height:40px;border-radius:50%;background:linear-gradient(#b9546a,#8f2f46);color:white;box-shadow:0 3px 0 var(--deep)}.bar{grid-area:bar;height:14px;display:flex;align-items:center;cursor:pointer;position:relative;margin-top:6px}.bar:before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:4px;background:#e9aab666}.bar i{height:4px;background:linear-gradient(90deg,#e9aab6,#8f2f46);position:relative}.bar b{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--rose);transform:translateX(-50%);box-shadow:0 0 0 3px white}.times{grid-area:times;display:flex;justify-content:space-between;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}.sheet-note{margin-top:18px;font-size:18px;line-height:1.3;transform:rotate(-1deg)}
.album__stage{position:relative;width:100%;margin-top:34px;display:flex;align-items:center;justify-content:center}.album-wrap{position:relative;width:min(66vw,292px)}.polaroid{position:relative;padding:22px 16px 20px;display:flex;flex-direction:column;align-items:center;background:var(--paper);border-radius:22px;box-shadow:0 18px 38px #8a556238;touch-action:pan-y;transition:transform .3s,opacity .3s}.tape{position:absolute;top:-10px;left:50%;width:74px;height:20px;transform:translateX(-50%);border-radius:4px;background:#e9bfc7c0}.polaroid-art{width:100%;aspect-ratio:1/1.02;display:grid;place-items:center;position:relative;background:linear-gradient(140deg,#f8e3e7,#e4e8dc);border-radius:14px;overflow:hidden}.polaroid-art svg{max-width:100%;max-height:100%}.polaroid-photo{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center}.photo-error{padding:18px;color:#8a4659;font-size:12px;line-height:1.5}.polaroid-meta{margin-top:6px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);font-weight:bold}.polaroid-caption{font-size:18px;line-height:1.28;margin-top:8px;color:var(--ink);font-style:italic}.arrow{position:absolute;top:50%;z-index:4;width:40px;height:40px;transform:translateY(-50%);border-radius:50%;background:#ffffffdb;color:var(--soft);font-size:20px;box-shadow:0 4px 12px #8a55622e}.arrow.left{left:0}.arrow.right{right:0}.dots{display:flex;gap:9px;justify-content:center;margin-top:22px}.dots span{width:8px;height:8px;border-radius:50%;background:#a63e5640}.dots span.on{background:var(--rose);transform:scale(1.25)}.album-cta{margin-top:18px;min-height:64px;display:grid;place-items:center}
.wishes .h-lg{max-width:15ch}.wishes-row{width:calc(100% + 40px);margin:24px -20px 0;padding:10px 20px 40px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.wish{flex:0 0 auto;width:min(41vw,150px);min-height:276px;padding:18px 12px;border-radius:24px;display:grid;place-items:center;scroll-snap-align:center;box-shadow:0 12px 26px #8a556224,inset 0 0 0 1px #ffffffd9;transition:.3s}.wish.pink{background:linear-gradient(#fdf0f2,#fbe1e7)}.wish.peach{background:linear-gradient(#fff7e6,#fdebcf)}.wish.lav{background:linear-gradient(#f2f5ee,#e1e8db)}.wish-face{display:flex;flex-direction:column;align-items:center;gap:22px}.wish-face.open{gap:8px}.wish-pick{font-size:10px;letter-spacing:.26em;text-transform:uppercase;font-weight:bold;color:#7d5f68}.wish-label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);font-weight:bold}.wish-text{font-size:15px;line-height:1.5;font-style:italic;text-align:center}.basket{position:relative;width:190px;height:80px;margin:40px auto 0}.basket-blooms{position:absolute;left:0;right:0;top:-34px;display:flex;justify-content:space-around}.basket svg{position:relative;z-index:2}.wish-face.open{animation:rise .6s var(--ease) both}.flower.pop{animation:pop .6s var(--ease) both}@keyframes pop{from{opacity:0;transform:scale(.3) translateY(14px)}}
.finale{justify-content:center}.finale-card{position:relative;width:100%;padding:62px 22px 28px;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(#fffaf2,#f8efe3);border-radius:26px;border-bottom:3px solid #ecd2c6;box-shadow:0 26px 50px #8a556233}.finale-avatar{position:absolute;top:-44px;left:50%;transform:translateX(-50%)}
.letter{max-width:560px;padding:0;align-items:stretch}.letter-top{position:sticky;top:0;z-index:6;padding:12px 0 10px;display:flex;justify-content:center;background:linear-gradient(#f8ede4f2 55%,transparent)}.letter-paper{padding:26px 26px 70px;margin-top:-10px;background:linear-gradient(#f8ede4,#f5e9df);text-align:left;box-shadow:0 0 60px #f8ede4e6}.letter-avatar{display:flex;justify-content:center;margin-top:4px}.letter-eyebrow{text-align:center;margin-top:20px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;font-weight:bold;color:var(--rose)}.letter-greeting{text-align:center;margin-top:6px;font-size:clamp(32px,8.4vw,42px);transform:rotate(-1.5deg)}.letter-rule{display:flex;align-items:center;gap:10px;margin:18px -26px 24px 0;color:var(--rose)}.letter-rule i{flex:1;border-top:1.5px dashed #7a566066}.letter-p{font-size:16px;line-height:1.8;font-weight:500;color:#2e2a2a;margin-bottom:18px}.letter-sign{margin-top:28px;display:flex;flex-direction:column;gap:2px;text-align:right;padding-right:6px}.letter-sign .script{font-size:24px;color:var(--ink)}.letter-from{font-size:28px!important;color:var(--rose)!important}.letter-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:36px 0 8px}

/* ---- navigation language ---- */
.nav{margin-top:auto;padding-top:28px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}.nav .fwd{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.nav .fwd>*{animation:rise .5s var(--ease) backwards}.nav .fwd .hint{margin:0}.nav .fwd .done{margin:0;font-size:22px}.nav .back:empty{display:none}.finale .nav{margin-top:30px;padding-top:0}
.ghost{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:10px 18px;border-radius:999px;background:#ffffff99;box-shadow:0 2px 10px #8a55621a;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a4659;transition:.18s}.ghost:hover{background:#ffffffe0}.ghost:active{transform:translateY(2px)}
#trail{position:fixed;top:calc(env(safe-area-inset-top,0px) + 11px);left:0;height:3px;width:0;z-index:20;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#e9aab6,#8f2f46);transition:width .7s var(--ease);pointer-events:none}
.music{position:fixed;z-index:20;top:max(14px,calc(env(safe-area-inset-top) + 10px));right:max(14px,env(safe-area-inset-right));width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffffdb;color:var(--rose);font-size:19px;box-shadow:0 4px 12px #8a55622e;animation:screenIn .5s var(--ease) both}.music[hidden]{display:none}.music.off{color:var(--soft)}.music.off:after{content:"";position:absolute;width:24px;height:2px;border-radius:2px;background:var(--soft);transform:rotate(-45deg)}
.dots span.seen{background:#a63e5699}
.album__stage .polaroid.swap{animation:slideIn .45s var(--ease) both}@keyframes slideIn{from{opacity:0;transform:translateX(calc(var(--sd,1)*36px)) rotate(calc(var(--sd,1)*3deg))}}
/* ---- handwritten notes ---- */
.notes .h-lg{max-width:16ch}.note-stack{position:relative;isolation:isolate;width:100%;margin-top:34px;touch-action:pan-y}
.note-stack:before,.note-stack:after{content:"";position:absolute;inset:8px 6px -8px;z-index:-1;border-radius:8px 16px 14px 8px;background:#fffaf4;box-shadow:0 10px 24px #8a556224;opacity:0;transition:opacity .3s;transform:rotate(2.6deg)}.note-stack:after{inset:14px 12px -14px;z-index:-2;background:#f6eef0;transform:rotate(-2.4deg)}
.note-stack[data-left="1"]:before,.note-stack[data-left="2"]:before,.note-stack[data-left="2"]:after{opacity:1}
.note{position:relative;min-height:384px;padding:32px 22px 28px 44px;text-align:left;border-radius:6px 16px 14px 8px;background:linear-gradient(90deg,transparent 33px,#b8506a59 33px,#b8506a59 34.5px,transparent 34.5px),repeating-linear-gradient(transparent 0 31px,#84947b38 31px 32px),var(--paper);box-shadow:0 18px 38px #8a556238;transform:rotate(var(--tilt,0deg))}
.note.swap{animation:noteIn .5s var(--ease) both}@keyframes noteIn{from{opacity:0;transform:translate(calc(var(--sd,1)*30px),-14px) rotate(calc(var(--tilt,0deg) + var(--sd,1)*4deg))}to{opacity:1;transform:rotate(var(--tilt,0deg))}}
.note .tape{top:-10px;left:50%}.note-no{position:absolute;top:10px;right:18px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;font-weight:bold;color:var(--rose)}.note-doodle{position:absolute;top:24px;right:16px;opacity:.9}
.note-label{margin:0;font-size:15px;line-height:32px;font-weight:400;color:var(--rose)}.note-text{margin:0;font-size:19px;line-height:32px;color:var(--ink)}.note-sign{display:block;font-size:19px;line-height:32px;text-align:right;color:var(--script)}
/* ---- finale petals ---- */
.petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}.petal{position:absolute;top:-50px;animation:fall var(--t) linear var(--dl) both}@keyframes fall{from{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}to{opacity:.9;transform:translate(var(--sx),115vh) rotate(var(--r))}}
@media(min-width:560px){.wish{width:170px}.wishes-row{justify-content:center;overflow:visible}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- Formula 1 + chess scrapbook layer (additive; same sticker language as the cats & flowers) ---- */
:root{--burg:#7C2638;--blush:#E9BFC7;--ivory:#F8EDE4;--char:#292626;--sage:#84947B}
.stk{position:absolute;z-index:3;pointer-events:none;line-height:0;transform:rotate(var(--r,0deg));filter:drop-shadow(1.6px 0 0 #fffaf4) drop-shadow(-1.6px 0 0 #fffaf4) drop-shadow(0 1.6px 0 #fffaf4) drop-shadow(0 -1.6px 0 #fffaf4) drop-shadow(0 3px 3px #7c263833)}
.stk.flat{filter:drop-shadow(0 2px 2px #7c263829)}
.stk svg,.piece,.f1car{overflow:visible}
.washi-chk{position:absolute;z-index:3;pointer-events:none;width:72px;height:12px;border-radius:2px;opacity:.86;transform:rotate(var(--r,0deg));background:conic-gradient(var(--char) 25%,#fffaf4 0 50%,var(--char) 0 75%,#fffaf4 0) 0 0/12px 12px;box-shadow:0 2px 3px #7c263826}
.doodle{position:absolute;pointer-events:none;z-index:0}
.ambient-piece{position:absolute;opacity:.2;line-height:0;animation:bob 13s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(var(--r,0deg))}50%{transform:translate(8px,-16px) rotate(calc(var(--r,0deg)*-1))}}

/* progress trail: a little car drives the lap as you move through the pages */
#trailcar{position:fixed;z-index:21;left:0;top:env(safe-area-inset-top,0px);line-height:0;pointer-events:none;transition:left .7s var(--ease)}

/* envelope: postage stamp, taped corner, and a road above the envelope */
.stamp{position:absolute;right:13px;bottom:13px;z-index:1;width:46px;height:56px;transform:rotate(5deg);pointer-events:none;filter:drop-shadow(0 2px 2px #7c263833)}
.stamp svg{display:block}.stamp .piece{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%)}
.road{position:absolute;z-index:0;left:-6%;right:-6%;top:0;height:26px;overflow:hidden;pointer-events:none;transition:opacity .35s}
.road:before{content:"";position:absolute;left:0;right:0;bottom:3px;border-top:2px dashed #a63e5659}
.road .car{position:absolute;bottom:3px;left:-70px;line-height:0;animation:drive 13s linear 1.2s infinite both}
.road .car svg{animation:rev .34s ease-in-out infinite}
@keyframes drive{from{left:-70px}to{left:100%}}@keyframes rev{50%{transform:translateY(-1px)}}
.env.open ~ .road{opacity:0}

/* finish line at the end of the letter */
.letter-finish{position:relative;height:62px;margin:34px 0 0}
.letter-finish:before{content:"";position:absolute;left:0;right:46px;bottom:9px;border-top:2px dashed #a63e5659}
.lf-finish{position:absolute;right:118px;bottom:3px;width:12px;height:30px;border-radius:2px;background:conic-gradient(var(--char) 25%,#fffaf4 0 50%,var(--char) 0 75%,#fffaf4 0) 0 0/12px 12px;box-shadow:0 0 0 1px #29262633}
.lf-car{position:absolute;right:50px;bottom:6px;line-height:0}

/* finale: tiny chequered ribbon along the bottom of the card */
.finale-card:after{content:"";position:absolute;left:30px;right:30px;bottom:11px;height:12px;border-radius:3px;opacity:.85;background:conic-gradient(var(--char) 25%,#fffaf4 0 50%,var(--char) 0 75%,#fffaf4 0) 0 0/12px 12px}
.finale-card{padding-bottom:42px}

.album__stage .doodle{left:50%;top:50%;width:114%;transform:translate(-50%,-52%) rotate(-4deg);opacity:.8}
@media(prefers-reduced-motion:reduce){.ambient-piece,.road .car,.road .car svg{animation:none!important}.road .car{left:56%}#trailcar{transition:none}}
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"></div><main id="stage"></main>
<div id="trail" aria-hidden="true"></div><div id="trailcar" aria-hidden="true"></div>
<button class="music off" id="music" hidden onclick="toggleAudio()" aria-label="Play music">♪</button>
<audio id="song" src="assets/song.mp3" preload="metadata" loop></audio>
<script>
const C={

function next(){go(ORDER[ORDER.indexOf(stage)+1])}
function back(){go(ORDER[ORDER.indexOf(stage)-1])}
function restart(){albumIndex=albumMax=noteIndex=noteMax=0;opened=[];envOpened=false;go("envelope")}
function render(focus){let root=$("#stage");root.innerHTML="";root.className="enter";let el=({envelope,card,album,notes,wishes,finale,letter})[stage]();root.appendChild(el);if(focus){el.tabIndex=-1;el.focus({preventScroll:true})}chrome()}
function chrome(){$("#trail").style.width=ORDER.indexOf(stage)/(ORDER.length-1)*100+"%";$("#trailcar").style.left=`calc((100% - 56px)*${ORDER.indexOf(stage)/(ORDER.length-1)})`;$("#music").hidden=!(envOpened&&stage!=="envelope"&&stage!=="card")}
function ghost(t,fn){return `<button class="ghost" onclick="${fn}"><span aria-hidden="true">←</span> ${esc(t)}</button>`}
function hintLine(t){return `<p class="hint">${esc(t)}</p>`}
function nav(fwd,bk){return `<div class="nav rise" style="--d:.3s"><div class="fwd" id="navFwd">${fwd||""}</div><div class="back" id="navBack">${bk||""}</div></div>`}
function dotsHTML(n,cur,max){return Array.from({length:n},(_,i)=>`<span class="${i===cur?"on":i<=max?"seen":""}"></span>`).join("")}
function swipe(el,fn){let sx=null;el.addEventListener("pointerdown",e=>{sx=e.clientX});el.addEventListener("pointerup",e=>{if(sx==null)return;let dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)fn(dx<0?1:-1)});el.addEventListener("pointercancel",()=>sx=null)}
addEventListener("keydown",e=>{if(busy||e.altKey||e.ctrlKey||e.metaKey)return;let d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(!d)return;if(stage==="album")moveAlbum(d);else if(stage==="notes")moveNote(d)});
addEventListener("hashchange",()=>{let s=location.hash.slice(1);if(s===lastHash)return;lastHash=s;go(ORDER.includes(s)?s:"envelope",{pop:true})});


function envelope(){let e=document.createElement("section");e.className="screen envelope";e.innerHTML=`<div class="rise">${pill(C.envelope.pill)}</div><h1 class="display h-xl rise" style="--d:.09s">${C.envelope.title}</h1><div class="script script-lg rise" style="--d:.18s">${C.envelope.script} ♡</div><div class="envelope__cat rise" style="--d:.27s">${cat("dancing",90)}</div><div class="env-stage rise" style="--d:.36s"><div class="env" id="env"><div class="env-body"><svg viewBox="0 0 300 200" width="100%" height="100%"><path d="M0 0L150 112L300 0M0 200L150 104L300 200" fill="none" stroke="#9c6650" stroke-width="1.4" opacity=".55"/><path d="M150 168c-8-6-9-12-4-14 2-1 4 0 4 2 0-2 2-3 4-2 5 2 4 8-4 14z" fill="#e0bfae"/></svg>${envTrims()}</div><div class="env-flap"><div class="front"><svg viewBox="0 0 300 112" preserveAspectRatio="none"><polygon points="1,1 299,1 150,111"/></svg></div><svg class="back" viewBox="0 0 300 112" preserveAspectRatio="none"><polygon points="1,111 299,111 150,1"/></svg></div><button class="seal" onclick="openEnvelope()" aria-label="Open the envelope">♡</button></div>${roadHTML()}</div><p class="hint" id="envhint">${C.envelope.hint} ✲</p>`;return e}
function openEnvelope(){let env=$("#env");if(!env||busy||env.classList.contains("open"))return;env.classList.add("open");envOpened=true;$("#envhint").style.opacity=0;if(C.song.autoplayOnOpen)audio.play().catch(()=>{});envTimer=setTimeout(()=>go("card"),2400)}
function catFace(){return `<svg width="100" viewBox="0 0 120 120"><g fill="#fff" stroke="#2b2330" stroke-width="2.6"><path d="M28 44Q22 18 31 15Q39 16 49 27M92 44Q98 18 89 15Q81 16 71 27"/><path d="M38 84Q35 113 60 113Q85 113 82 84"/><ellipse cx="60" cy="56" rx="38" ry="31"/></g><ellipse cx="40" cy="62" rx="6" ry="3.6" fill="#f7c0ca"/><ellipse cx="80" cy="62" rx="6" ry="3.6" fill="#f7c0ca"/><path d="M44 56Q48 50 52 56M68 56Q72 50 76 56" fill="none" stroke="#2b2330" stroke-width="2.6" stroke-linecap="round"/><path d="M56 61Q60 65 64 61" fill="none" stroke="#2b2330" stroke-width="2.2"/><path d="M60 111C46 102 46 90 54 90 58 90 60 93 60 95 60 93 62 90 66 90 74 90 74 102 60 111z" fill="#e8332f"/></svg>`}
function card(){let s=document.createElement("section");s.className="screen card-screen";s.innerHTML=`<div class="sheet">${cardTrims()}<div class="sheet-avatar rise">${avatar(catFace(),92)}</div><div class="rise">${pill(C.card.pill)}</div><h1 class="display h-xl rise">${C.card.title}</h1><div class="script script-lg rise" style="color:var(--rose)">${C.card.name} ♡</div><div class="divider rise"><i></i>✲<i></i></div><p class="body sheet__msg rise">${C.card.message}</p><div class="player rise"><div class="cover">🌷</div><div class="player-title">${C.song.title}</div><button class="play" onclick="toggleAudio()" id="playBtn">▶</button><div class="player-sub">${C.song.subtitle}</div><div class="bar" onclick="seekAudio(event)" role="slider" aria-label="Song position"><i id="progress" style="width:0%"></i><b id="knob" style="left:0%"></b></div><div class="times"><span id="current">0:00</span><span id="duration">--:--</span></div></div><p class="script sheet-note rise">${C.song.note}</p></div>${nav(btn(C.card.button,"next()"))}`;return s}
function timeFmt(t){return !isFinite(t)||t<=0?"0:00":`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`}
function toggleAudio(){if(audio.paused)audio.play().catch(()=>{});else audio.pause()}
audio.addEventListener("play",()=>{let b=$("#playBtn");if(b)b.textContent="Ⅱ"});audio.addEventListener("pause",()=>{let b=$("#playBtn");if(b)b.textContent="▶"});audio.addEventListener("loadedmetadata",()=>{let d=$("#duration");if(d)d.textContent=timeFmt(audio.duration)});audio.addEventListener("timeupdate",()=>{let p=audio.duration?audio.currentTime/audio.duration*100:0;let i=$("#progress"),k=$("#knob"),c=$("#current");if(i)i.style.width=p+"%";if(k)k.style.left=p+"%";if(c)c.textContent=timeFmt(audio.currentTime)});
function seekAudio(e){if(!audio.duration)return;let r=e.currentTarget.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration}
function syncMusic(){let m=$("#music");m.classList.toggle("off",audio.paused);m.setAttribute("aria-label",audio.paused?"Play music":"Pause music")}
audio.addEventListener("play",syncMusic);audio.addEventListener("pause",syncMusic);
function memoryArt(kind){if(kind==="bouquetCat")return cat("bouquet",220);if(kind==="partyCat")return `<div style="font-size:70px">🎉</div>${cat("dancing",190)}<div class="script" style="font-size:24px">BIRTHDAY!!!</div>`;return cat("panda",180)}
function polaroid(swap){let m=C.album.memories[albumIndex],n=C.album.memories.length;return `<article class="polaroid ${swap?"swap":""}" id="polaroid"><span class="tape"></span>${polaroidTrims(albumIndex)}<div class="polaroid-art"><img class="polaroid-photo" src="${esc(m.src)}" alt="${esc(m.caption)}" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend', '<span class=&quot;photo-error&quot;>Photo not found — check the image path</span>')"></div><div class="polaroid-meta">memory ${pad(albumIndex+1)} / ${pad(n)}</div><p class="script polaroid-caption">${esc(m.caption)}</p></article>`}
function albumFwd(){let n=C.album.memories.length;return ready("album")?btn(C.album.button,"next()"):hintLine(`${C.album.lock} · ${albumMax+1} / ${n}`)}
function album(){let s=document.createElement("section");s.className="screen album";let n=C.album.memories.length;s.innerHTML=`<div class="rise">${pill(C.album.pill)}</div><h2 class="display h-lg rise">${C.album.title}</h2><p class="sub rise">${C.album.subtitle}</p><div class="album__stage rise">${track()}<button class="arrow left" id="albPrev" onclick="moveAlbum(-1)" aria-label="Previous memory" style="visibility:${albumIndex===0?"hidden":"visible"}">←</button><div class="album-wrap" id="albWrap">${polaroid(false)}</div><button class="arrow right" id="albNext" onclick="moveAlbum(1)" aria-label="Next memory" style="visibility:${albumIndex===n-1?"hidden":"visible"}">→</button></div><div class="dots" id="albDots">${dotsHTML(n,albumIndex,albumMax)}</div>${nav(albumFwd(),ghost(C.nav.back,"back()"))}`;swipe(s.querySelector("#albWrap"),moveAlbum);return s}
function moveAlbum(d){let n=C.album.memories.length,t=albumIndex+d;if(t<0||t>=n)return;albumIndex=t;albumMax=Math.max(albumMax,t);let w=$("#albWrap");if(!w)return;w.style.setProperty("--sd",d);w.innerHTML=polaroid(true);$("#albPrev").style.visibility=t===0?"hidden":"visible";$("#albNext").style.visibility=t===n-1?"hidden":"visible";$("#albDots").innerHTML=dotsHTML(n,t,albumMax);$("#navFwd").innerHTML=albumFwd()}
/* handwritten notes: read one at a time, in order */
const NOTE_PAPER=["#fffaf4","#fdf0f2","#f2f5ee","#fff7e6","#f2f8ef"],NOTE_TILT=[-2.2,1.6,-1.2,2,-1.8],NOTE_FLOWER=["rosette","peach","daisy","rosette","peach"];
function noteHTML(swap){let n=C.notes.items[noteIndex],t=C.notes.items.length;return `<article class="note ${swap?"swap":""}" style="--paper:${NOTE_PAPER[noteIndex%5]};--tilt:${NOTE_TILT[noteIndex%5]}deg"><span class="tape"></span><span class="note-no">note ${pad(noteIndex+1)} / ${pad(t)}</span><span class="note-doodle">${flower(NOTE_FLOWER[noteIndex%5],34)}</span>${noteSticker(noteIndex)}<h3 class="script note-label">${n.label}</h3><p class="script note-text">${n.text}</p><span class="script note-sign">— ${C.notes.sign}</span></article>`}
function noteFwd(){return noteIndex<C.notes.items.length-1?btn(C.notes.next,"moveNote(1)"):btn(C.notes.button,"next()")}
function noteBack(){return noteIndex>0?ghost(C.nav.prevNote,"moveNote(-1)"):ghost(C.nav.back,"back()")}
function noteDepth(){return Math.min(2,C.notes.items.length-1-noteIndex)}
function notes(){let s=document.createElement("section");s.className="screen notes";let n=C.notes.items.length;noteMax=Math.max(noteMax,noteIndex);s.innerHTML=`<div class="rise">${pill(C.notes.pill)}</div><h2 class="display h-lg rise">${C.notes.title}</h2><p class="sub rise">${C.notes.subtitle}</p><div class="note-stack rise" id="noteStack" data-left="${noteDepth()}"><div id="noteSlot">${noteHTML(false)}</div></div><div class="dots" id="noteDots">${dotsHTML(n,noteIndex,noteMax)}</div>${nav(noteFwd(),noteBack())}`;swipe(s.querySelector("#noteStack"),moveNote);return s}
function moveNote(d){let n=C.notes.items.length,t=noteIndex+d;if(t<0||t>=n)return;noteIndex=t;noteMax=Math.max(noteMax,t);let st=$("#noteStack");if(!st)return;st.style.setProperty("--sd",d);st.dataset.left=noteDepth();$("#noteSlot").innerHTML=noteHTML(true);$("#noteDots").innerHTML=dotsHTML(n,t,noteMax);$("#navFwd").innerHTML=noteFwd();$("#navBack").innerHTML=noteBack()}

function wishFace(i){let w=C.wishes.items[i];return opened.includes(i)?`<span class="wish-face open">${flower(w.flower,24)}<span class="wish-label">✲ ${w.label} ✲</span><span class="wish-text script">${w.text}</span></span>`:`<span class="wish-face">${flower(w.flower,64)}<span class="wish-pick">${C.wishes.closed}</span></span>`}
function bloomsHTML(newest){return opened.map(i=>flower(C.wishes.items[i].flower,42,i===newest?"pop":"")).join("")}
function wishDots(){return C.wishes.items.map((_,i)=>`<span class="${opened.includes(i)?"on":""}"></span>`).join("")}
function wishFwd(){return ready("wishes")?`<p class="script done">${C.wishes.done}</p>${btn(C.wishes.button,"next()")}`:hintLine(`${C.wishes.lock} · ${opened.length} / ${C.wishes.items.length}`)}
function wishes(){let s=document.createElement("section");s.className="screen wishes";s.innerHTML=`<div class="rise">${pill(C.wishes.pill)}</div><h2 class="display h-lg rise">${C.wishes.title}</h2><p class="sub rise">${C.wishes.subtitle}</p><div class="wishes-row rise">${C.wishes.items.map((w,i)=>`<button class="wish ${["pink","peach","lav"][i]} ${opened.includes(i)?"is-open":""}" onclick="pickWish(${i})" id="wish${i}" aria-label="Wish ${i+1} of ${C.wishes.items.length}">${wishFace(i)}</button>`).join("")}</div><div class="basket"><div class="basket-blooms" id="blooms">${bloomsHTML(-1)}</div>${basketFlag()}<svg viewBox="0 0 200 84" width="100%" height="100%"><defs><linearGradient id="bk" x2="0" y2="1"><stop stop-color="#f4e3cc"/><stop offset="1" stop-color="#ebd5b6"/></linearGradient></defs><path d="M8 6H192C188 30 194 52 176 70Q100 84 24 70C6 52 12 30 8 6Z" fill="url(#bk)" stroke="#9c6650" stroke-width="2.4"/></svg></div><div class="dots" id="wishDots">${wishDots()}</div>${nav(wishFwd(),ghost(C.nav.back,"back()"))}`;return s}
function pickWish(i){if(opened.includes(i)||!$("#wish"+i))return;opened.push(i);let b=$("#wish"+i);b.classList.add("is-open");b.innerHTML=wishFace(i);$("#blooms").innerHTML=bloomsHTML(i);$("#wishDots").innerHTML=wishDots();$("#navFwd").innerHTML=wishFwd();let nx=C.wishes.items.findIndex((_,k)=>!opened.includes(k));setTimeout(()=>{let t=nx>-1?$("#wish"+nx):$("#navFwd");if(t&&t.scrollIntoView)t.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})},450)}

function finale(){let s=document.createElement("section");s.className="screen finale";let t=["rosette","peach","daisy"],p="";for(let i=0;i<16;i++)p+=`<span class="petal" style="left:${Math.random()*100}%;--t:${5+Math.random()*4}s;--dl:${Math.random()*3}s;--sx:${(Math.random()-.5)*160}px;--r:${(Math.random()-.5)*720}deg">${flower(t[i%3],18+Math.random()*16)}</span>`;[piece("pawn",24,"blush"),flagSvg(28),piece("knight",24,"ivory"),helmet(26),piece("rook",24,"sage"),trophy(26)].forEach((h,i)=>{p+=`<span class="petal" style="left:${8+i*16+Math.random()*8}%;--t:${6+Math.random()*3}s;--dl:${Math.random()*3}s;--sx:${(Math.random()-.5)*120}px;--r:${(Math.random()-.5)*360}deg">${h}</span>`});s.innerHTML=`<div class="petals" aria-hidden="true">${p}</div><div class="finale-card"><span class="corner tl">${flower("rosette",36)}</span><span class="corner tr">${flower("peach",30)}</span><span class="corner br">${flower("daisy",30)}</span><div class="finale-avatar">${avatar(cat("panda",72),84)}</div>${finaleTrims()}<h2 class="display h-lg">${C.finale.title}</h2><p class="body" style="max-width:36ch;color:#4d4547">${C.finale.message}</p></div>${nav(btn(C.finale.button,"next()"),ghost(C.nav.back,"back()"))}`;return s}
function letter(){let s=document.createElement("section");s.className="screen letter";s.innerHTML=`<div class="letter-top">${pill(C.letter.pill)}</div><div class="letter-paper"><div class="letter-avatar">${avatar(cat("pink",78),86)}</div><p class="letter-eyebrow">✲ ${C.letter.eyebrow} ✲</p><h2 class="script letter-greeting">${C.letter.greeting}</h2><div class="letter-rule">✲ <i></i></div>${C.letter.paragraphs.map(p=>`<p class="letter-p rise">${p}</p>`).join("")}<div class="letter-sign rise"><span class="script">${C.letter.signoff}</span><span class="script letter-from">${C.letter.from}</span></div>${letterFinish()}<div class="letter-nav">${ghost(C.nav.back,"back()")}<button class="ghost" onclick="restart()">↺ ${C.letter.replay}</button></div></div>`;return s}
function popHearts(el){for(let i=0;i<6;i++){let h=document.createElement("span");h.className="avatar-heart";h.textContent="♥";h.style.setProperty("--x",`${(Math.random()-.5)*100}px`);h.style.left=`${30+Math.random()*40}%`;el.appendChild(h);setTimeout(()=>h.remove(),1400)}}
$("#trailcar").innerHTML=f1car(30);ambient();setHash("envelope",true);render();
</script></body></html>
